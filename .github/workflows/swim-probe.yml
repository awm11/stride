name: Swim timetable probe
on:
  push:
    paths: ['.github/workflows/swim-probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the swimming timetable by day
        run: |
          mkdir -p "$RUNNER_TEMP/p" && cd "$RUNNER_TEMP/p"
          UA="Mozilla/5.0 (StrideTimetable; personal use)"
          A="https://jagssportsclub.co.uk/wp/wp-admin/admin-ajax.php"
          curl -sS -A "$UA" -D hdr-weekly.txt -H "Origin: https://alexmoorephysics.com" -o weekly.html -w '%{http_code} weekly\n' "$A?action=get_timetable&category=swimming" | tee status.txt
          for i in $(seq 0 13); do d=$(date -u -d "+$i days" +%F)
            curl -sS -A "$UA" -D "hdr-$d.txt" -H "Origin: https://alexmoorephysics.com" -o "day-$d.html" -w "%{http_code} %{size_download} $d\n" "$A?action=get_events_timetable&day=$d&calendar=swimming" >> status.txt
          done
      - name: Save results
        if: always()
        run: |
          cd "$RUNNER_TEMP/p"
          git init -q -b swim-probe && git add -A
          git -c user.name="Stride CI" -c user.email="ci@users.noreply.github.com" commit -qm "probe ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" swim-probe
