# Builds the Stride Android app from index.html and publishes it as a GitHub release.
# The phone downloads it from https://github.com/awm11/stride/releases/latest/download/stride.apk
#
# Signing: add the repository secret ANDROID_KEYSTORE (base64 of the PKCS12 key, alias "stride").
# Updates only install over an existing copy when they are signed with the same key. Without the
# secret the build still runs as a check, signed with a throwaway key, and nothing is published.
name: Android app

on:
  push:
    branches: [main]
    paths: ['index.html', 'icons/**', 'app/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          KEY="$RUNNER_TEMP/stride.p12"
          if [ -n "$ANDROID_KEYSTORE" ]; then
            echo "$ANDROID_KEYSTORE" | tr -d ' \r\n' | base64 -d > "$KEY"
            keytool -list -keystore "$KEY" -storepass stride-android -alias stride > /dev/null
            echo "PUBLISH=true" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE secret yet, so this build is a check only and won't be published."
            keytool -genkeypair -keystore "$KEY" -storetype PKCS12 -alias stride -keyalg RSA -keysize 2048 -validity 30 \
              -storepass stride-android -keypass stride-android -dname "CN=Stride check build"
            echo "PUBLISH=false" >> "$GITHUB_ENV"
          fi
          echo "STRIDE_KEYSTORE_FILE=$KEY" >> "$GITHUB_ENV"

      - name: Build APK
        run: bash app/build-android.sh "${{ github.run_number }}" 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Publish release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-${{ github.run_number }}" app/stride.apk \
            --title "Stride for Android (build ${{ github.run_number }})" \
            --notes "Open this page on your Android phone and download **stride.apk**, then open the downloaded file to install it. If Android asks, allow your browser to install apps. Installing a newer build over an older one keeps your activities." \
            --latest

      # Keeps the latest build log on the ci-logs branch so it can be read without signing in to GitHub.
      - name: Save build log
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/logs" && cd "$RUNNER_TEMP/logs"
          cp "$RUNNER_TEMP/build.log" build.log 2>/dev/null || echo "(no build log)" > build.log
          printf 'run %s\ncommit %s\nstatus %s\npublished %s\n' "${{ github.run_number }}" "${{ github.sha }}" "${{ job.status }}" "${PUBLISH:-false}" > status.txt
          git init -q -b ci-logs
          git add -A
          git -c user.name="Stride CI" -c user.email="ci@users.noreply.github.com" commit -qm "Android build ${{ github.run_number }}: ${{ job.status }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs
