<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stride</title>
<meta name="description" content="Record runs, rides and walks with GPS: route map, pace, speed, splits and elevation.">
<meta name="theme-color" content="#eef2f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1418" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stride">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>
<style>
:root{
  --bg:#eef2f3; --surface:#ffffff; --surface2:#f5f7f8; --ink:#14202a; --ink2:#43515d; --muted:#67747f; --line:#d5dce0;
  --run:#d42a6c; --ride:#2a67d6; --walk:#b07d0a; --ele:#8a6a42; --danger:#c42f28; --good:#1d7f55;
  --accent:var(--run); --on-accent:#ffffff; --scrim:rgba(10,16,20,.45);
  --cond:'Barlow Condensed','Arial Narrow',system-ui,sans-serif; --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r-sm:10px; --r:16px; --r-lg:24px;
  --tabh:68px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0e1418; --surface:#182027; --surface2:#1f2930; --ink:#e7edf0; --ink2:#b4bfc7; --muted:#8a96a0; --line:#2c3842;
  --run:#e8487f; --ride:#4f86ea; --walk:#b8841a; --ele:#b89468; --danger:#ef6158; --good:#4cc08b;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
body[data-type="ride"]{--accent:var(--ride)} body[data-type="walk"]{--accent:var(--walk)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4;overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{margin:0;font-weight:700;line-height:1.15}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-family:var(--cond);font-variant-numeric:tabular-nums;letter-spacing:.005em}

/* ---------- app frame ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:var(--safe-t)}
.scroll-pad{padding:18px 16px calc(28px);max-width:640px;margin:0 auto}
.tabs{display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--safe-b);flex:none}
.tabs button{flex:1;height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:13px;font-weight:600;position:relative}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tabs .recdot{position:absolute;top:12px;right:calc(50% - 20px);width:10px;height:10px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 3px var(--surface)}
.vtitle{font-family:var(--cond);font-size:34px;font-weight:700;letter-spacing:.01em;margin:4px 0 14px}
.vhead{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* ---------- record ---------- */
#v-record{display:flex;flex-direction:column;overflow:hidden;padding-top:0}
.map-wrap{position:relative;flex:1 1 auto;min-height:170px;background:var(--surface2)}
.map{position:absolute;inset:0;background:var(--surface2)}
.map.nomap{display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:24px;font-size:15px}
.map-top{position:absolute;left:12px;right:12px;top:calc(var(--safe-t) + 12px);z-index:500;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none}
.map-top>*{pointer-events:auto}
.seg{display:inline-flex;background:var(--surface);border-radius:999px;padding:4px;box-shadow:0 1px 0 var(--line),0 4px 14px rgba(0,0,0,.12)}
.seg button{min-height:44px;padding:0 16px;border-radius:999px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:6px}
.seg button[aria-checked="true"]{background:var(--ink);color:var(--surface)}
.seg.wide{display:flex;box-shadow:none;background:var(--surface2);border:1px solid var(--line)}
.seg.wide button{flex:1;justify-content:center;min-height:48px}
.gps{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border-radius:999px;padding:0 14px;height:44px;font-weight:600;font-size:15px;box-shadow:0 1px 0 var(--line),0 4px 14px rgba(0,0,0,.12);white-space:nowrap}
.gps i{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.gps.good i{background:var(--good)} .gps.ok i{background:var(--walk)} .gps.bad i{background:var(--danger)}
.mapbtn{position:absolute;right:12px;bottom:12px;z-index:500;width:52px;height:52px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 0 var(--line),0 4px 14px rgba(0,0,0,.15)}
.mapbtn.on{color:var(--accent)}
.live{flex:none;background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;margin-top:-18px;position:relative;z-index:600;padding:14px 18px 6px;box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.hero{display:flex;align-items:baseline;gap:8px;line-height:.86}
.hero .big{font-family:var(--cond);font-weight:700;font-size:clamp(84px,27vw,132px);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hero .unit{font-family:var(--cond);font-size:28px;font-weight:600;color:var(--ink2)}
.hero .state{margin-left:auto;align-self:center;font-weight:600;font-size:15px;color:var(--muted)}
.hero .state.rec{color:var(--danger)}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin-top:10px}
.lgrid.three{grid-template-columns:1fr 1fr 1fr;margin-top:6px;padding-top:8px;border-top:1px solid var(--line)}
.m b{display:block;font-family:var(--cond);font-weight:600;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.lgrid.three .m b{font-size:30px}
.m small{display:block;color:var(--muted);font-size:14px;font-weight:500;margin-top:2px}
.controls{flex:none;background:var(--surface);padding:10px 18px 16px;display:flex;gap:12px;justify-content:center;align-items:center;min-height:120px}
.start{width:104px;height:104px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-family:var(--cond);font-size:30px;font-weight:700;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 45%,transparent)}
.start:active,.pill:active{transform:scale(.97)}
.pill{flex:1;max-width:260px;height:84px;border-radius:42px;font-family:var(--cond);font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
.pill svg.i{width:28px;height:28px}
.pill.dark{background:var(--ink);color:var(--surface)}
.pill.acc{background:var(--accent);color:var(--on-accent)}
.pill.line{background:var(--surface2);border:2px solid var(--line)}
.lockbtn{width:64px;height:84px;border-radius:32px;background:var(--surface2);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.hold{position:relative;overflow:hidden}
.hold .fill{position:absolute;inset:0;background:var(--accent);transform-origin:left;transform:scaleX(0);opacity:.35}
.hold.pressing .fill{transform:scaleX(1);transition:transform 1s linear}
.hint{color:var(--muted);font-size:14px;text-align:center}
.banner{margin:0 0 8px;padding:10px 12px;border-radius:var(--r-sm);background:var(--surface2);border:1px solid var(--line);font-size:14px;color:var(--ink2)}

/* ---------- lists & cards ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips button{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;color:var(--ink2);white-space:nowrap;background:var(--surface)}
.chips button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.iconbtn{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1.5px solid var(--line);flex:none}
.group{margin:18px 0 6px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.group h2{font-size:18px}
.group span{color:var(--muted);font-size:14px}
.act{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;min-height:84px;border:1px solid var(--line)}
.glyph{width:60px;height:60px;flex:none;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center}
.glyph svg{width:46px;height:46px;overflow:visible}
.act .tx{flex:1;min-width:0}
.act .nm{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act .dt{color:var(--muted);font-size:14px}
.act .st{display:flex;gap:14px;margin-top:3px;font-family:var(--cond);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
.act .st small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:500;margin-left:2px}
.tdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.empty{text-align:center;padding:48px 12px;color:var(--ink2)}
.empty h2{font-family:var(--cond);font-size:26px;margin-bottom:6px;color:var(--ink)}
.btn{min-height:52px;padding:0 20px;border-radius:999px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface2);border:1.5px solid var(--line)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--danger)}
.btn.danger.solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.5}

/* ---------- cards / settings ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h3{font-size:17px;margin-bottom:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:4px 0}
.row+.row{border-top:1px solid var(--line)}
.row .lbl{font-weight:500}
.row .sub{display:block;color:var(--muted);font-size:14px;font-weight:400}
.switch{width:60px;height:36px;border-radius:18px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--good)}
.switch[aria-checked="true"]::after{transform:translateX(24px)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.btnrow .btn{flex:1;min-width:140px}
.note{color:var(--muted);font-size:14px;margin:8px 0 0}
.syncline{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink2);margin:4px 0 8px}
.syncline i{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.syncline.synced i{background:var(--good)} .syncline.syncing i{background:var(--walk)} .syncline.error i{background:var(--danger)}

/* ---------- stats ---------- */
.tot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tot .card{margin:0;padding:12px}
.tot b{display:block;font-family:var(--cond);font-size:32px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.tot b small{font-size:16px;color:var(--ink2);font-weight:600;margin-left:2px}
.tot span{display:block;font-size:13px;color:var(--muted)}
.tot .t{font-weight:600;color:var(--ink);font-size:14px;margin-bottom:4px}
.pbs{width:100%;border-collapse:collapse}
.pbs td{padding:10px 0;border-top:1px solid var(--line);vertical-align:middle}
.pbs tr:first-child td{border-top:0}
.pbs .v{font-family:var(--cond);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.pbs .d{color:var(--muted);font-size:13px;text-align:right}
.pbs button{text-align:left;width:100%;min-height:44px}

/* ---------- charts ---------- */
.chart{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart svg{display:block;width:100%;overflow:visible}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font-size:12px;font-family:var(--body)}
.chart .xh{stroke:var(--ink2);stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;top:0;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:5px 9px;border-radius:8px;font-size:13px;font-weight:600;white-space:nowrap;pointer-events:none;font-variant-numeric:tabular-nums}
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.chead h3{margin:0}
.minichips{display:flex;gap:6px}
.minichips button{min-height:36px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);font-size:14px;font-weight:600;color:var(--ink2)}
.minichips button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* ---------- detail page ---------- */
.page{position:fixed;inset:0;z-index:1000;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.ptop{position:sticky;top:0;z-index:700;display:flex;align-items:center;gap:8px;padding:calc(var(--safe-t) + 8px) 10px 8px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px)}
.ptop .ttl{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dmap{height:44vh;min-height:240px;position:relative;background:var(--surface2)}
.dhead{padding:16px 16px 4px;max-width:640px;margin:0 auto}
.dhead h1{font-family:var(--cond);font-size:34px;letter-spacing:.005em}
.dhead p{margin:2px 0 0;color:var(--muted)}
.dbody{padding:8px 16px 40px;max-width:640px;margin:0 auto}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;margin:8px 0 16px}
.sgrid .m b{font-size:32px}
.sgrid .m.k b{font-size:44px}
.splits{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.splits th{font-size:13px;color:var(--muted);font-weight:500;text-align:left;padding:0 0 6px}
.splits td{padding:7px 0;border-top:1px solid var(--line);font-family:var(--cond);font-size:20px;font-weight:600}
.splits td.bar{width:42%;padding-left:10px}
.splits .b{height:10px;border-radius:0 5px 5px 0;background:var(--accent)}
.splits td.e{color:var(--ink2);text-align:right;width:20%}
.splits tr.part td{color:var(--muted)}
.notes{white-space:pre-wrap}

/* ---------- sheets / gate / toast ---------- */
#sheet-wrap{position:fixed;inset:0;z-index:2000;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;width:100%;max-width:560px;background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:20px 18px calc(18px + var(--safe-b));max-height:92vh;overflow-y:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
.sheet h2{font-family:var(--cond);font-size:30px;margin-bottom:12px}
.sheet .stack{display:flex;flex-direction:column;gap:10px;margin-top:14px}
label.f{display:block;font-weight:600;font-size:15px;margin:12px 0 6px}
input.t,textarea.t{width:100%;min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);padding:12px 14px;font-size:17px}
textarea.t{min-height:90px;resize:vertical}
.summary{display:flex;gap:18px;font-family:var(--cond);font-size:26px;font-weight:600;margin-bottom:4px;font-variant-numeric:tabular-nums}
.summary small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:500;display:block}
#gate{position:fixed;inset:0;z-index:3000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px calc(32px + var(--safe-b));text-align:center;overflow:hidden}
#gate .contours{position:absolute;inset:0;width:100%;height:100%;opacity:.55;pointer-events:none}
#gate .inner{position:relative;max-width:380px;width:100%}
#gate img{width:96px;height:96px;border-radius:22px}
#gate h1{font-family:var(--cond);font-size:56px;margin:14px 0 6px}
#gate p{color:var(--ink2);margin:0 0 26px}
#gate .btn{width:100%;margin-bottom:10px;min-height:58px;font-size:18px}
#gate .msg{color:var(--danger);min-height:1.4em;font-size:15px}
#toast{position:fixed;left:50%;bottom:calc(var(--tabh) + var(--safe-b) + 14px);transform:translateX(-50%);z-index:4000;background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:14px;font-weight:500;max-width:min(92vw,480px);box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}

/* ---------- map styling ---------- */
.leaflet-container{background:var(--surface2);font-family:var(--body)}
:root[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9) saturate(.7)}
.leaflet-control-attribution{font-size:11px}
:root[data-theme="dark"] .leaflet-control-attribution{background:rgba(24,32,39,.8)!important;color:var(--ink2)}
:root[data-theme="dark"] .leaflet-control-attribution a{color:var(--ink2)}
.me-dot{width:22px;height:22px;border-radius:50%;background:var(--accent);border:4px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.4)}
.pin{width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pin.s{background:var(--good)} .pin.e{background:var(--ink)}
.scrub{width:18px;height:18px;border-radius:50%;background:#fff;border:4px solid var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.4)}

@media (min-height:760px){ .m b{font-size:48px} }
@media (max-height:680px){ .hero .big{font-size:76px} .m b{font-size:36px} .lgrid.three .m b{font-size:26px} .controls{min-height:100px;padding-bottom:10px} .start{width:88px;height:88px} .pill{height:72px} .lockbtn{height:72px} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body data-type="run">
<div id="app">
  <main id="views">
    <section id="v-record" class="view" aria-label="Record">
      <div class="map-wrap">
        <div id="rec-map" class="map"></div>
        <div class="map-top">
          <div class="seg" id="type-pick" role="radiogroup" aria-label="Activity type"></div>
          <div class="gps" id="gps-chip"><i></i><span>GPS</span></div>
        </div>
        <button class="mapbtn" id="recenter" aria-label="Keep map centred on me"></button>
      </div>
      <div class="live" id="live">
        <div id="live-banner"></div>
        <div class="hero"><span class="big" id="l-dist">0.00</span><span class="unit" id="l-dunit">km</span><span class="state" id="l-state"></span></div>
        <div class="lgrid">
          <div class="m"><b id="l-time" class="num">0:00</b><small>Time</small></div>
          <div class="m"><b id="l-pace" class="num">–:––</b><small id="l-pace-l">Pace</small></div>
        </div>
        <div class="lgrid three">
          <div class="m"><b id="l-avg" class="num">–:––</b><small id="l-avg-l">Avg pace</small></div>
          <div class="m"><b id="l-gain" class="num">0</b><small id="l-gain-l">Climb</small></div>

  idx.push(pts.length - 1);

  for (let b = 0; b < idx.length; b += 100){
    const chunk = idx.slice(b, b + 100);
    const url = 'https://api.open-meteo.com/v1/elevation?latitude=' + chunk.map(i => pts[i][0].toFixed(5)).join(',') + '&longitude=' + chunk.map(i => pts[i][1].toFixed(5)).join(',');
    const res = await fetch(url); if (!res.ok) throw new Error('elevation ' + res.status);
    const j = await res.json(); if (!Array.isArray(j.elevation) || j.elevation.length !== chunk.length) throw new Error('elevation shape');

  const t = S.settings.theme === 'auto' ? (mq.matches ? 'dark' : 'light') : S.settings.theme;
  document.documentElement.dataset.theme = t;
  $$('meta[name="theme-color"]').forEach(m => m.setAttribute('content', t === 'dark' ? '#0e1418' : '#eef2f3'));
  if (recMap) setTiles(recMap); if (dMap) setTiles(dMap);
}
mq.addEventListener && mq.addEventListener('change', applyTheme);

/* ---------- rendering ---------- */
const TABS = [['record','Record',I.rec],['list','Activities',I.list],['stats','Stats',I.stats],['you','You',I.you]];
function renderTabs(){
  $('#tabs').innerHTML = TABS.map(([k, n, ic]) => `<button role="tab" data-tab="${k}" aria-selected="${S.tab === k}">${ic}<span>${n}</span>${k === 'record' && rec ? '<span class="recdot" aria-label="Recording"></span>' : ''}</button>`).join('');
}
function showTab(t){
  S.tab = t;
  $$('.view').forEach(v => v.hidden = v.id !== 'v-' + t);
  if (t === 'record'){ startWatch(); setTimeout(() => { ensureRecMap(); if (recMap) recMap.invalidateSize(); updateRecMap(); renderRecMapTrack(); }, 30); }
  else if (!rec) stopWatch();
  render();
}
function render(fromRemote){
  document.body.dataset.type = rec ? rec.type : S.recType;
  renderTabs(); renderGate();
  const ae = document.activeElement, typing = ae && /^(INPUT|TEXTAREA)$/.test(ae.tagName);
  if (S.tab === 'record') renderRecord();
  if (fromRemote && typing) return;
  if (S.tab === 'list') renderList();
  if (S.tab === 'stats') renderStats();
  if (S.tab === 'you') renderYou();
}

function renderRecord(){
  const tp = rec ? rec.type : S.recType;
  $('#type-pick').innerHTML = Object.entries(TYPES).map(([k, t]) => `<button role="radio" data-type="${k}" aria-checked="${tp === k}" ${rec ? 'disabled' : ''}>${t.name}</button>`).join('');
  renderRecenter(); renderLive(); renderControls();
}
function renderLive(){
  if (S.tab !== 'record') return;
  const tp = rec ? rec.type : S.recType, T = TYPES[tp], u = U();
  const dist = rec ? rec.dist : 0, secs = rec ? activeMs() / 1000 : 0;
  $('#l-dist').textContent = fmtDist(dist, 2);
  $('#l-dunit').textContent = u.dl;
  $('#l-time').textContent = fmtDur(secs);
  const sp = currentSpeed();
  if (T.pace){
    $('#l-pace').textContent = fmtPace(sp > 0.3 ? u.d / sp : Infinity); $('#l-pace-l').textContent = `Pace /${u.dl}`;
    $('#l-avg').textContent = fmtPace(paceOf(dist, secs)); $('#l-avg-l').textContent = `Avg pace /${u.dl}`;
  } else {
    $('#l-pace').textContent = fmtSpeed(sp); $('#l-pace-l').textContent = `Speed ${u.sp}`;
    $('#l-avg').textContent = fmtSpeed(secs ? dist / secs : 0); $('#l-avg-l').textContent = `Avg ${u.sp}`;
  }
  $('#l-gain').textContent = fmtEle(rec ? rec.gain : 0); $('#l-gain-l').textContent = `Climb ${u.el}`;
  const alt = fix && fix.alt != null ? fix.alt + (rec ? (rec.off || 0) : (eleOff || 0)) : null;
  $('#l-ele').textContent = fmtEle(alt); $('#l-ele-l').textContent = `Elevation ${u.el}`;
  const st = $('#l-state');
  st.textContent = rec ? (rec.paused ? 'Paused' : 'Recording') : '';
  st.className = 'state' + (rec && !rec.paused ? ' rec' : '');
  // GPS chip
  const chip = $('#gps-chip');
  let cls = '', txt = 'Finding GPS…';
  if (!navigator.geolocation){ cls = 'bad'; txt = 'No GPS'; }
  else if (S.gpsErr === 'denied'){ cls = 'bad'; txt = 'Location blocked'; }
  else if (fix && now() - fix.t < 20000){ const a = Math.round(fix.acc); cls = a <= 12 ? 'good' : a <= 30 ? 'ok' : 'bad'; txt = `GPS ±${a} m`; }
  chip.className = 'gps ' + cls; chip.lastElementChild.textContent = txt;
  // banner
  let b = '';

  else if (!rec && S.gpsErr === 'denied') b = 'Location is blocked. Allow location for this app in your phone’s settings to record.';
  const bn = $('#live-banner'); if (bn.dataset.t !== b){ bn.dataset.t = b; bn.innerHTML = b ? `<p class="banner">${esc(b)}</p>` : ''; }
}
function renderControls(){
  const c = $('#controls');
  if (!rec){
    const ready = fix && now() - fix.t < 20000 && fix.acc <= 50;
    c.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><button class="start" data-act="start">Start</button><span class="hint">${ready ? 'Keep the app open while you go' : 'You can start now; the route fills in once GPS is found'}</span></div>`;
    return;
  }
  if (locked){
    c.innerHTML = `<button class="pill line hold" data-hold="unlock" aria-label="Press and hold to unlock"><span class="fill"></span>${I.unlock}<span>Hold to unlock</span></button>`;
    return;
  }

    ? `<button class="pill acc" data-act="resume">${I.play}<span>Resume</span></button><button class="pill dark" data-act="finish">${I.stop}<span>Finish</span></button>`

/* list */
function glyphSvg(pv, color){
  const pts = decodePreview(pv);
  if (pts.length < 2) return `<svg viewBox="0 0 46 46"><circle cx="23" cy="23" r="5" fill="${color}"/></svg>`;
  const lat0 = pts[0][0], k = Math.cos(lat0 * RAD);
  const xy = pts.map(([a, b]) => [b * k, -a]);
  const xs = xy.map(p => p[0]), ys = xy.map(p => p[1]);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const sc = 40 / Math.max(maxX - minX, maxY - minY, 1e-9);
  const ox = 3 + (40 - (maxX - minX) * sc) / 2, oy = 3 + (40 - (maxY - minY) * sc) / 2;
  const d = xy.map((p, i) => (i ? 'L' : 'M') + ((p[0] - minX) * sc + ox).toFixed(1) + ' ' + ((p[1] - minY) * sc + oy).toFixed(1)).join('');
  const e = xy[xy.length - 1];
  return `<svg viewBox="0 0 46 46" aria-hidden="true"><path d="${d}" fill="none" stroke="${color}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${((e[0]-minX)*sc+ox).toFixed(1)}" cy="${((e[1]-minY)*sc+oy).toFixed(1)}" r="3" fill="${color}"/></svg>`;
}
function statLine(a){
  const st = a.stats || {}, T = TYPES[a.type] || TYPES.run, u = U();
  const third = T.pace ? `${fmtPace(paceOf(st.dist, st.moving || st.time))}<small>/${u.dl}</small>` : `${fmtSpeed(st.dist / (st.moving || st.time || 1))}<small>${u.sp}</small>`;
  return `<span>${fmtDist(st.dist)}<small>${u.dl}</small></span><span>${fmtDur(st.time)}</span><span>${third}</span>`;
}
function renderList(){
  const v = $('#v-list');
  const all = liveActs(), acts = all.filter(a => S.filter === 'all' || a.type === S.filter);
  const chips = [['all','All'], ...Object.entries(TYPES).map(([k, t]) => [k, t.name + 's'])];
  let html = `<div class="scroll-pad"><div class="vhead"><h1 class="vtitle">Activities</h1><button class="iconbtn" data-act="import-gpx" aria-label="Import a GPX file">${I.upload}</button></div>
    <div class="chips">${chips.map(([k, n]) => `<button data-filter="${k}" aria-pressed="${S.filter === k}">${n}</button>`).join('')}</div>`;
  if (!acts.length){
    html += all.length ? `<div class="empty"><h2>Nothing here yet</h2><p>No ${esc(TYPES[S.filter].name.toLowerCase())}s recorded so far.</p></div>`
      : `<div class="empty"><h2>No activities yet</h2><p>Head to Record and tap Start, or import a GPX file from another app.</p><div class="btnrow" style="justify-content:center"><button class="btn primary" data-tab="record">Record an activity</button><button class="btn" data-act="import-gpx">Import GPX</button></div></div>`;
  } else {
    let curKey = null;
    const groups = {};
    acts.forEach(a => { const d = new Date(a.start), k = d.getFullYear() * 12 + d.getMonth(); (groups[k] ||= []).push(a); });
    for (const k of Object.keys(groups).sort((a, b) => b - a)){
      const g = groups[k], tot = g.reduce((s, a) => s + (a.stats?.dist || 0), 0);
      html += `<div class="group"><h2>${MF.format(new Date(g[0].start))}</h2><span>${g.length} ${g.length === 1 ? 'activity' : 'activities'}, ${fmtDist(tot, 1)} ${U().dl}</span></div>`;
      html += g.map(a => `<button class="act" data-open="${a.id}">
        <span class="glyph" style="--accent:var(--${a.type})">${glyphSvg(a.pv, `var(--${a.type})`)}</span>
        <span class="tx"><span class="nm" style="display:block">${esc(a.name)}</span><span class="dt" style="display:block"><span class="tdot" style="background:var(--${a.type})"></span>${TYPES[a.type]?.name || ''}, ${fmtWhen(a.start)}</span>
        <span class="st">${statLine(a)}</span></span></button>`).join('');
    }
  }
  v.innerHTML = html + '</div>';
}

/* stats */
const weekStart = t => { const d = new Date(t); d.setHours(0,0,0,0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d.getTime(); };
function renderStats(){
  const v = $('#v-stats');
  const f = S.sfilter, acts = liveActs().filter(a => f === 'all' || a.type === f), u = U();
  const nowD = new Date(), ws = weekStart(now()), ms = new Date(nowD.getFullYear(), nowD.getMonth(), 1).getTime(), ys = new Date(nowD.getFullYear(), 0, 1).getTime();
  const sum = from => { const g = acts.filter(a => a.start >= from); return { n:g.length, d:g.reduce((s, a) => s + (a.stats?.dist || 0), 0), t:g.reduce((s, a) => s + (a.stats?.time || 0), 0), e:g.reduce((s, a) => s + (a.stats?.gain || 0), 0) }; };
  const tile = (t, x) => `<div class="card"><span class="t">${t}</span><b class="num">${fmtDist(x.d, 1)}<small>${u.dl}</small></b><span>${x.n} ${x.n === 1 ? 'activity' : 'activities'}</span><span>${fmtDur(x.t)}</span><span>${fmtEle(x.e)} ${u.el} climb</span></div>`;
  const chips = [['all','All'], ...Object.entries(TYPES).map(([k, t]) => [k, t.name + 's'])];
  // weekly bars, last 12 weeks
  const weeks = []; for (let i = 11; i >= 0; i--){ const d = new Date(ws); d.setDate(d.getDate() - i * 7); weeks.push(d.getTime()); }
  const wk = weeks.map((w, i) => { const end = i < 11 ? weeks[i + 1] : Infinity; return acts.filter(a => a.start >= w && a.start < end).reduce((s, a) => s + (a.stats?.dist || 0), 0) / u.d; });
  // personal bests for the chosen type (runs when showing everything)
  const pbType = f === 'all' ? 'run' : f;
  const pbs = BESTS[pbType].map(([D, label]) => {
    let best = null; liveActs().filter(a => a.type === pbType).forEach(a => { const s = a.stats?.best?.[D]; if (s && (!best || s < best.s)) best = { s, a }; });
    return { D, label, best };
  }).filter(x => x.best);
  v.innerHTML = `<div class="scroll-pad"><h1 class="vtitle">Stats</h1>
    <div class="chips">${chips.map(([k, n]) => `<button data-sfilter="${k}" aria-pressed="${f === k}">${n}</button>`).join('')}</div>
    <div class="tot">${tile('This week', sum(ws))}${tile('This month', sum(ms))}${tile(String(nowD.getFullYear()), sum(ys))}</div>
    <div class="card"><div class="chead"><h3>Distance per week (${u.dl})</h3></div><div class="chart" id="wk-chart"></div></div>
    <div class="card"><h3>Personal bests: ${TYPES[pbType].name.toLowerCase()}s</h3>
      ${pbs.length ? `<table class="pbs">${pbs.map(p => `<tr><td><button data-open="${p.best.a.id}"><b>${p.label}</b><br><span class="d" style="text-align:left;display:block">${esc(p.best.a.name)}, ${DFY.format(new Date(p.best.a.start))}</span></button></td><td class="v">${fmtDur(p.best.s)}<div class="d">${pbType === 'ride' ? fmtSpeed(p.D / p.best.s) + ' ' + u.sp : fmtPace(paceOf(p.D, p.best.s)) + ' /' + u.dl}</div></td></tr>`).join('')}</table>`
        : `<p class="note">Your fastest ${BESTS[pbType].map(b => b[1]).slice(0, 3).join(', ')} and longer efforts appear here once you’ve recorded some ${TYPES[pbType].name.toLowerCase()}s.</p>`}
    </div></div>`;
  const labels = weeks.map(w => { const d = new Date(w); return d.getDate() + ' ' + d.toLocaleString('en-GB', { month:'short' }); });
  barChart($('#wk-chart'), wk, labels, f === 'all' ? cssVar('--ink2') : cssVar('--' + f), x => x.toFixed(1) + ' ' + u.dl);
}

/* ---------- charts (hand-drawn SVG) ---------- */
const NS = 'http://www.w3.org/2000/svg';
function niceTicks(lo, hi, n = 4){
  if (!(hi > lo)){ hi = lo + 1; }
  const raw = (hi - lo) / n, mag = 10 ** Math.floor(Math.log10(raw)), step = [1, 2, 2.5, 5, 10].map(x => x * mag).find(x => x >= raw) || raw;
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(6));
  return out;
}
// One series against distance. Scrubbing reports the index under the finger.
function lineChart(el, o){
  const W = Math.max(260, el.clientWidth || 320), H = o.h || 150, L0 = 44, R0 = 8, T0 = 30, B0 = 24;
  const xs = o.xs, ys = o.ys, n = xs.length;
  const valid = ys.filter(v => v != null && isFinite(v));
  if (n < 2 || !valid.length){ el.innerHTML = '<p class="note">Not enough data for this chart.</p>'; return null; }
  let lo = o.yMin ?? Math.min(...valid), hi = o.yMax ?? Math.max(...valid);
  if (hi - lo < (o.minSpan || 1)){ const m = (hi + lo) / 2; lo = m - (o.minSpan || 1) / 2; hi = m + (o.minSpan || 1) / 2; }
  if (!o.ticks && o.yMin == null){ const st = niceTicks(lo, hi, 3); const step = st.length > 1 ? st[1] - st[0] : 1; lo = Math.floor(lo / step + 1e-9) * step; hi = Math.ceil(hi / step - 1e-9) * step; }
  const ticks = o.ticks ? o.ticks(lo, hi) : niceTicks(lo, hi, 3);
  lo = Math.min(lo, ticks[0]); hi = Math.max(hi, ticks[ticks.length - 1]);
  const x0 = xs[0], x1 = xs[n - 1] || 1;
  const X = x => L0 + (x - x0) / (x1 - x0 || 1) * (W - L0 - R0), Y = y => T0 + (1 - (y - lo) / (hi - lo || 1)) * (H - T0 - B0);
  let d = '', started = false;
  for (let i = 0; i < n; i++){ const y = ys[i]; if (y == null || !isFinite(y)){ started = false; continue; } d += (started ? 'L' : 'M') + X(xs[i]).toFixed(1) + ' ' + Y(y).toFixed(1); started = true; }
  const area = o.area ? `<path d="${d}L${X(x1).toFixed(1)} ${Y(lo)}L${X(x0).toFixed(1)} ${Y(lo)}Z" fill="${o.color}" fill-opacity=".18" stroke="none"/>` : '';
  const xt = niceTicks(x0, x1, 4).filter(v => v > x0 && v < x1);
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(o.label)}">
    <g class="grid">${ticks.map(t => `<line x1="${L0}" x2="${W - R0}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${L0 - 6}" y="${Y(t) + 4}" text-anchor="end">${esc(o.yFmt(t))}</text>`).join('')}</g>
    ${xt.map(t => `<text x="${X(t)}" y="${H - 6}" text-anchor="middle">${esc(o.xFmt(t))}</text>`).join('')}
    ${area}<path d="${d}" fill="none" stroke="${o.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <line class="xh" y1="${T0}" y2="${H - B0}" x1="-10" x2="-10" visibility="hidden"/><circle class="dot" r="5" fill="${o.color}" stroke="var(--surface)" stroke-width="2" cx="-10" cy="-10" visibility="hidden"/></svg><div class="tip" hidden></div>`;
  const svg = el.querySelector('svg'), xh = svg.querySelector('.xh'), dot = svg.querySelector('.dot'), tip = el.querySelector('.tip');
  const api = {
    show(i){
      if (i == null){ xh.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); tip.hidden = true; return; }
      const x = X(xs[i]), y = ys[i]; xh.setAttribute('x1', x); xh.setAttribute('x2', x); xh.setAttribute('visibility', 'visible');
      if (y != null && isFinite(y)){ dot.setAttribute('cx', x); dot.setAttribute('cy', Y(y)); dot.setAttribute('visibility', 'visible'); } else dot.setAttribute('visibility', 'hidden');
      tip.hidden = false; tip.textContent = o.tipFmt(i); tip.style.left = clamp(x / W * el.clientWidth, 60, el.clientWidth - 60) + 'px';
    },
  };
  const idxAt = ev => { const r = svg.getBoundingClientRect(); const x = (ev.clientX - r.left) / r.width * W; const v = x0 + (x - L0) / (W - L0 - R0) * (x1 - x0); let a = 0, b = n - 1; while (b - a > 1){ const m = (a + b) >> 1; if (xs[m] < v) a = m; else b = m; } return Math.abs(xs[a] - v) < Math.abs(xs[b] - v) ? a : b; };
  let hideT;
  svg.addEventListener('pointermove', ev => { clearTimeout(hideT); o.onScrub(idxAt(ev)); });
  svg.addEventListener('pointerdown', ev => { clearTimeout(hideT); o.onScrub(idxAt(ev)); });
  svg.addEventListener('pointerleave', ev => { if (ev.pointerType === 'mouse') hideT = setTimeout(() => o.onScrub(null), 600); });
  svg.addEventListener('pointerup', ev => { if (ev.pointerType !== 'mouse'){ hideT = setTimeout(() => o.onScrub(null), 2500); } });
  return api;
}
function barChart(el, vals, labels, color, fmt){
  const W = Math.max(260, el.clientWidth || 320), H = 150, L0 = 34, R0 = 4, T0 = 10, B0 = 24, n = vals.length;
  const hi = Math.max(1, ...vals), ticks = niceTicks(0, hi, 3); if (ticks[ticks.length - 1] < hi) ticks.push(+(ticks[ticks.length - 1] + (ticks[1] - ticks[0])).toFixed(6)); const top = ticks[ticks.length - 1];
  const bw = (W - L0 - R0) / n, Y = v => T0 + (1 - v / top) * (H - T0 - B0);
  const bars = vals.map((v, i) => { if (v <= 0) return ''; const x = L0 + i * bw + 1, w = bw - 2, y = Y(v), h = Y(0) - y; const r = Math.min(4, w / 2, h);
    return `<path d="M${x} ${Y(0)}V${y + r}Q${x} ${y} ${x + r} ${y}H${x + w - r}Q${x + w} ${y} ${x + w} ${y + r}V${Y(0)}Z" fill="${color}"/>`; }).join('');
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Distance per week for the last 12 weeks">
    <g class="grid">${ticks.map(t => `<line x1="${L0}" x2="${W - R0}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${L0 - 6}" y="${Y(t) + 4}" text-anchor="end">${t}</text>`).join('')}</g>
    ${bars}${labels.map((l, i) => (i % 3 === 2 || i === n - 1) && i !== n - 2 ? `<text x="${L0 + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle">${i === n - 1 ? 'This wk' : esc(l)}</text>` : '').join('')}
    <rect class="hl" x="-100" y="${T0}" width="${bw}" height="${H - T0 - B0}" fill="var(--ink)" fill-opacity=".06"/></svg><div class="tip" hidden></div>`;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), hl = svg.querySelector('.hl');
  const show = ev => { const r = svg.getBoundingClientRect(); const i = clamp(Math.floor(((ev.clientX - r.left) / r.width * W - L0) / bw), 0, n - 1);
    hl.setAttribute('x', L0 + i * bw); tip.hidden = false; tip.textContent = `Week of ${labels[i]}: ${fmt(vals[i])}`; tip.style.left = clamp((L0 + i * bw + bw / 2) / W * el.clientWidth, 90, el.clientWidth - 90) + 'px'; };

}

/* ---------- files: GPX and backups ---------- */
function download(name, text, mime){
  const blob = new Blob([text], { type:mime }), url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
const slug = s => String(s || 'activity').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'activity';
function gpxOf(a, trk){
  const segs = decodeTrack(trk), dem = eleArrFor(a, trk); let o = 0;
  const xmlEsc = s => esc(s);
  const body = segs.map(s => '<trkseg>' + s.map((p, i) => { const e = dem ? dem[o + i] : p[2]; return `<trkpt lat="${p[0].toFixed(6)}" lon="${p[1].toFixed(6)}">${e != null ? `<ele>${e.toFixed(1)}</ele>` : ''}<time>${new Date(p[3]).toISOString()}</time></trkpt>`; }).join('') + (o += s.length, '</trkseg>')).join('\n');
  const gt = { run:'running', ride:'cycling', walk:'walking' }[a.type];
  return `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Stride" xmlns="http://www.topografix.com/GPX/1/1">\n<metadata><time>${new Date(a.start).toISOString()}</time></metadata>\n<trk><name>${xmlEsc(a.name)}</name><type>${gt}</type>\n${body}\n</trk>\n</gpx>\n`;
}
async function exportGpx(){
  const a = S.acts[S.detail]; let trk = a && getTrack(a.id);
  if (a && !trk) trk = await fetchTrack(a.id);
  if (!trk){ toast('The route isn’t on this phone yet.'); return; }
  download(`${new Date(a.start).toISOString().slice(0, 10)}-${slug(a.name)}.gpx`, gpxOf(a, trk), 'application/gpx+xml');
}
function parseGpx(text){
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('That file isn’t a readable GPX file.');
  const tag = (el, n) => el.getElementsByTagNameNS('*', n)[0];
  let segEls = [...doc.getElementsByTagNameNS('*', 'trkseg')];
  const ptsOf = (els) => els.map(p => { const t = tag(p, 'time'), e = tag(p, 'ele'); return [parseFloat(p.getAttribute('lat')), parseFloat(p.getAttribute('lon')), e ? parseFloat(e.textContent) : null, t ? Date.parse(t.textContent) : NaN]; }).filter(p => isFinite(p[0]) && isFinite(p[1]));
  let segs = segEls.map(s => ptsOf([...s.getElementsByTagNameNS('*', 'trkpt')]));
  if (!segs.some(s => s.length)) segs = [ptsOf([...doc.getElementsByTagNameNS('*', 'rtept')])];
  segs = segs.filter(s => s.length);
  if (!segs.length) throw new Error('No route points were found in that file.');
  if (segs.some(s => s.some(p => !isFinite(p[3])))) throw new Error('That GPX file has no times, so pace can’t be worked out.');
  segs.forEach(s => s.sort((a, b) => a[3] - b[3]));
  segs.sort((a, b) => a[0][3] - b[0][3]);
  const nameEl = tag(doc, 'trk') && tag(tag(doc, 'trk'), 'name'), typeEl = tag(doc, 'type');
  const tt = (typeEl && typeEl.textContent || '').toLowerCase();
  const type = /ride|bik|cycl/.test(tt) ? 'ride' : /walk|hik/.test(tt) ? 'walk' : /run/.test(tt) ? 'run' : (S.filter in TYPES ? S.filter : 'run');
  return { segs, name:nameEl ? nameEl.textContent.trim() : '', type };
}
async function importGpx(file){
  try {
    const g = parseGpx(await file.text()), t0 = g.segs[0][0][3];
    if (liveActs().some(a => Math.abs(a.start - t0) < 1000)){ toast('That activity is already in Stride.'); return; }
    const trk = encodeTrack(g.segs, t0);
    const a = { id:newId(), type:g.type, name:g.name || defaultName(g.type, t0), notes:'', start:t0, trackRev:1, created:now(), imported:true };
    restat(a, trk); putTrack(a.id, trk); saveAct(a, true);
    if (S.settings.terrain && navigator.onLine) addTerrain(a.id, true);
    toast(`Imported “${a.name}”.`); render(); openDetail(a.id);
  } catch(e){ toast(e.message || 'Couldn’t import that file.', 5000); }
}
async function saveBackup(){
  const missing = liveActs().filter(a => !getTrack(a.id) && a.stats?.dist > 0);
  if (missing.length && store.user){ toast('Getting routes from the cloud…'); for (const a of missing) await fetchTrack(a.id); }
  const tracks = {}; liveActs().forEach(a => { const t = getTrack(a.id); if (t) tracks[a.id] = t; });
  const data = { app:APP, kind:'stride-backup', version:1, exportedAt:new Date().toISOString(), settings:S.settings, activities:liveActs(), tracks };
  download(`stride-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(data), 'application/json');
  const still = liveActs().filter(a => !tracks[a.id] && a.stats?.dist > 0).length;
  toast(still ? `Backup saved. ${still} route${still > 1 ? 's' : ''} couldn’t be included; sign in to fetch them.` : 'Backup saved.', still ? 5000 : 2500);
}
async function restoreBackup(file){
  try {
    const d = JSON.parse(await file.text());
    if (!d || d.kind !== 'stride-backup' || !Array.isArray(d.activities)) throw new Error('That isn’t a Stride backup file.');
    let added = 0, updated = 0;
    for (const a of d.activities){
      if (!a || !a.id || !TYPES[a.type]) continue;
      const l = S.acts[a.id];
      if (l && !l.deleted && (l.updatedAt || 0) >= (a.updatedAt || 0)) continue;
      const t = d.tracks && d.tracks[a.id];
      if (t) putTrack(a.id, t);
      S.acts[a.id] = { ...a, updatedAt:now() };
      if (t) markDirty('t_' + a.id);
      markDirty('a_' + a.id);
      l && !l.deleted ? updated++ : added++;
    }
    if (d.settings && typeof d.settings === 'object'){ S.settings = { ...DEFAULT_SETTINGS, ...d.settings }; S.settingsAt = now(); markDirty('settings'); }
    saveLocal(); applyTheme(); render();
    toast(`Restored: ${added} added, ${updated} updated.`);
  } catch(e){ toast(e.message && e.message.startsWith('That') ? e.message : 'Couldn’t read that backup file.', 5000); }
}

  if (d.sfilter){ S.sfilter = d.sfilter; renderStats(); return; }
  if (d.type && b.closest('#type-pick')){ if (rec) return; S.recType = d.type; S.settings.defType = d.type; saveLocal(); render(); renderRecMapTrack(); return; }
  if (d.stype){ $$('#sheet [data-stype]').forEach(x => x.setAttribute('aria-checked', String(x === b))); return; }
  if (d.set){ setSetting(d.set, d.val); return; }
  if (d.toggle){ setSetting(d.toggle, !S.settings[d.toggle]); if (d.toggle === 'keepAwake' && rec){ S.settings.keepAwake ? wakeOn() : wakeOff(); } return; }
  if (d.elesrc){ const a = S.acts[S.detail], trk = getTrack(S.detail); if (!a || !trk) return; a.eleSrc = d.elesrc; restat(a, trk); saveAct(a); renderDetail(); return; }
  switch (d.act){
    case 'start': startRec(); break;
    case 'pause': pauseRec(); break;
    case 'resume': resumeRec(); break;
    case 'finish': openFinish(); break;
    case 'lock': locked = true; renderControls(); toast('Buttons locked. Press and hold to unlock.'); break;
    case 'keep-going': closeLayer(); resumeRec(); break;
    case 'save-rec': { const n = $('#f-name').value.trim(), t = sheetType(), no = $('#f-notes').value.trim(); closeSheetNow(); history.replaceState({ layer:'detail' }, ''); saveRec(n, t, no); break; }
    case 'discard':
      if (b.dataset.armed){ closeSheetNow(); history.back(); discardRec(); }
      else { b.dataset.armed = '1'; b.textContent = 'Tap again to discard'; b.classList.add('solid'); }
      break;
    case 'close-sheet': closeLayer(); break;
    case 'back': closeLayer(); break;
    case 'edit': openEdit(); break;
    case 'save-edit': {
      const a = S.acts[S.detail]; if (!a) break;
      const t = sheetType(), typeChanged = t !== a.type;
      a.name = $('#f-name').value.trim() || a.name; a.notes = $('#f-notes').value.trim(); a.type = t;
      if (typeChanged){ const trk = getTrack(a.id); if (trk) restat(a, trk); }
      saveAct(a); closeLayer(); renderDetail(); break;
    }
    case 'delete': openDelete(); break;
    case 'confirm-delete': { const id = S.detail; closeSheetNow(); deleteAct(id); history.go(-2); setTimeout(() => { if (S.detail) closeDetailNow(); }, 300); toast('Activity deleted.'); break; }
    case 'gpx': exportGpx(); break;
    case 'terrain': toast('Getting terrain elevation…'); addTerrain(S.detail); break;
    case 'import-gpx': $('#file-gpx').click(); break;
    case 'backup': saveBackup(); break;
    case 'restore': $('#file-backup').click(); break;
    case 'signin': signIn(); break;
    case 'signout': signOut(); break;
    case 'gate-skip': gateSkipped = true; renderGate(); break;
  }
});
$('#detail').addEventListener('scroll', () => { const t = $('#d-ttl'); if (t) t.style.opacity = $('#detail').scrollTop > 240 ? '1' : '0'; }, { passive:true });
$('#recenter').addEventListener('click', () => { follow = !follow; renderRecenter(); if (follow) updateRecMap(); });
$('#file-gpx').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) importGpx(f); });
$('#file-backup').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) restoreBackup(f); });
// press-and-hold to unlock the recording buttons
let holdT = null;
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('[data-hold]'); if (!h) return;
  h.classList.add('pressing');
  holdT = setTimeout(() => { locked = false; renderControls(); }, 1000);
});
['pointerup','pointercancel','pointerleave'].forEach(t => document.addEventListener(t, e => { if (holdT){ clearTimeout(holdT); holdT = null; } $$('.hold.pressing').forEach(x => x.classList.remove('pressing')); }, true));
window.addEventListener('resize', () => { if (S.detail && dA) { clearTimeout(window._rz); window._rz = setTimeout(() => renderDetail(true), 200); } if (S.tab === 'stats') renderStats(); });

/* ---------- start-up ---------- */
history.replaceState({ layer:'root' }, '');
restoreLive();
applyTheme();
renderRecenter();
showTab('record');
if (rec){ startWatch(); wakeOn(); startTick(); }
initCloud();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
window.__stride = { S, store, analyze, encodeTrack, decodeTrack, get rec(){ return rec; } };
</script>
